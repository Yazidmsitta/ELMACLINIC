<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ElmaClinic — Aperçu</title><style>*{box-sizing:border-box}body{margin:0;background:#FAF9F6;color:#1C1C14;font:15px system-ui}header{padding:22px 28px;border-bottom:1px solid #E4E4D8;background:white}h1{font-size:22px;margin:0 0 8px}p{margin:0;color:#5C5C44;line-height:1.5}main{display:flex;gap:32px;max-width:1000px;margin:24px auto;padding:0 20px}nav{width:240px;flex-shrink:0;display:flex;flex-direction:column;gap:7px}button{font:inherit;text-align:left;cursor:pointer;border:1px solid #E4E4D8;background:white;padding:12px;border-radius:12px;color:inherit}button[aria-current=true]{background:#6C6B50;color:white}figure{margin:0}img{display:block;width:min(390px,100%);height:auto;box-shadow:0 8px 32px #0002;border:1px solid #E4E4D8;border-radius:18px}figcaption{margin:12px 0;color:#5C5C44}@media(max-width:700px){main{flex-direction:column}nav{width:100%;display:grid;grid-template-columns:1fr 1fr}}</style><header><h1>ElmaClinic · Aperçu Phase 6</h1><p>Rendus des écrans Flutter avec données de démonstration. Sélectionnez un écran pour le consulter.<br>Ce visualiseur ne permet pas la connexion, la saisie ou l’enregistrement de données.</p></header><main><nav aria-label="Écrans"></nav><figure><img alt=""><figcaption></figcaption></figure></main><script>const screens={"inventory":"Inventaire · ADMIN","expenses":"Dépenses · ADMIN","payment_ledger":"Paiements · ADMIN","payment_sheet":"Encaisser un paiement","website_review":"Réservations en ligne · À vérifier","login": "Connexion", "dashboard_admin": "Accueil · ADMIN", "dashboard_user": "Accueil · USER", "appointments_day": "Rendez-vous", "appointments_filters": "Filtres", "appointment_detail": "Détail du rendez-vous", "booking_client": "Nouveau rendez-vous", "catalog_clients_user": "Clients", "catalog_services_admin": "Prestations · ADMIN", "catalog_services_user": "Prestations · USER", "catalog_practitioners_admin": "Praticiennes", "more_admin": "Plus · ADMIN", "more_user": "Plus · USER", "empty": "État vide", "error": "Erreur réseau"};const nav=document.querySelector('nav');function show(id){document.querySelector('img').src=id+'.png';document.querySelector('img').alt=screens[id];document.querySelector('figcaption').textContent=screens[id];document.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.id===id));}Object.entries(screens).forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.id=id;b.onclick=()=>show(id);nav.append(b)});show('dashboard_admin');</script></html>
